lab:
  description: YANG learning lab with NETCONF and RESTCONF on two IOS-XE (CSR1000v)
    routers, OSPF between them, and an Alpine management PC on a shared management LAN.
  notes: |
    Import this file in CML2 (Lab Manager > Import). Start all nodes and wait
    until OSPF is FULL and YANG processes are running on R1/R2.

    MGMT LAN 172.16.0.0/24:
      R1 172.16.0.1  R2 172.16.0.2  MGMT-PC 172.16.0.10

    NETCONF TCP/830  RESTCONF HTTPS/443  SSH TCP/22
    Credentials: cisco / cisco

    Docs (EN + JA): labs/yang-netconf/README.md
    Client scripts: labs/yang-netconf/scripts/
  title: YANG NETCONF RESTCONF Lab
  version: 0.1.0
links:
  - id: l0
    n1: n0
    n2: n2
    i1: i0
    i2: i0
    label: R1-GigabitEthernet1<->SW-MGMT-port0
    conditioning: {}
  - id: l1
    n1: n1
    n2: n2
    i1: i0
    i2: i1
    label: R2-GigabitEthernet1<->SW-MGMT-port1
    conditioning: {}
  - id: l2
    n1: n3
    n2: n2
    i1: i0
    i2: i2
    label: MGMT-PC-eth0<->SW-MGMT-port2
    conditioning: {}
  - id: l3
    n1: n0
    n2: n1
    i1: i1
    i2: i1
    label: R1-GigabitEthernet2<->R2-GigabitEthernet2
    conditioning: {}
nodes:
  - boot_disk_size: 0
    configuration: |-
      !
      hostname R1
      !
      
      no ip domain lookup
      ip domain name lab.local
      !
      aaa new-model
      !
      aaa authentication login default local
      aaa authorization exec default local
      !
      enable secret cisco
      username cisco privilege 15 secret cisco
      !
      service timestamps debug datetime msec
      service timestamps log datetime msec
      !
      ip cef
      !
      crypto key generate rsa general-keys modulus 2048
      !
      ip ssh version 2
      !
      netconf-yang
      restconf
      ip http authentication local
      ip http server
      ip http secure-server
      !
      
      interface Loopback0
       description YANG-lab RID R1
       ip address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet1
       description MGMT LAN to SW-MGMT / MGMT-PC
       ip address 172.16.0.1 255.255.255.0
       no shutdown
      !
      
      interface GigabitEthernet2
       description OSPF to R2
       ip address 10.0.12.1 255.255.255.252
       ip ospf network point-to-point
       ip ospf hello-interval 5
       ip ospf dead-interval 20
       no shutdown
      !
      
      router ospf 1
       router-id 1.1.1.1
       passive-interface default
       no passive-interface GigabitEthernet2
       network 1.1.1.1 0.0.0.0 area 0
       network 10.0.12.0 0.0.0.3 area 0
      !
      
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       login local
       transport input ssh
      !
      end
    cpu_limit: 100
    cpus: 2
    data_volume: 0
    hide_links: false
    id: n0
    image_definition: null
    label: R1
    node_definition: csr1000v
    ram: 3072
    tags: []
    x: -200
    y: -40
    interfaces:
    - id: i0
      label: GigabitEthernet1
      slot: 0
      type: physical
    - id: i1
      label: GigabitEthernet2
      slot: 1
      type: physical
  - boot_disk_size: 0
    configuration: |-
      !
      hostname R2
      !
      
      no ip domain lookup
      ip domain name lab.local
      !
      aaa new-model
      !
      aaa authentication login default local
      aaa authorization exec default local
      !
      enable secret cisco
      username cisco privilege 15 secret cisco
      !
      service timestamps debug datetime msec
      service timestamps log datetime msec
      !
      ip cef
      !
      crypto key generate rsa general-keys modulus 2048
      !
      ip ssh version 2
      !
      netconf-yang
      restconf
      ip http authentication local
      ip http server
      ip http secure-server
      !
      
      interface Loopback0
       description YANG-lab RID R2
       ip address 2.2.2.2 255.255.255.255
      !
      interface GigabitEthernet1
       description MGMT LAN to SW-MGMT / MGMT-PC
       ip address 172.16.0.2 255.255.255.0
       no shutdown
      !
      
      interface GigabitEthernet2
       description OSPF to R1
       ip address 10.0.12.2 255.255.255.252
       ip ospf network point-to-point
       ip ospf hello-interval 5
       ip ospf dead-interval 20
       no shutdown
      !
      
      router ospf 1
       router-id 2.2.2.2
       passive-interface default
       no passive-interface GigabitEthernet2
       network 2.2.2.2 0.0.0.0 area 0
       network 10.0.12.0 0.0.0.3 area 0
      !
      
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       login local
       transport input ssh
      !
      end
    cpu_limit: 100
    cpus: 2
    data_volume: 0
    hide_links: false
    id: n1
    image_definition: null
    label: R2
    node_definition: csr1000v
    ram: 3072
    tags: []
    x: 200
    y: -40
    interfaces:
    - id: i0
      label: GigabitEthernet1
      slot: 0
      type: physical
    - id: i1
      label: GigabitEthernet2
      slot: 1
      type: physical
  - boot_disk_size: 0
    configuration: ums-yang-mgmt-01
    cpu_limit: 100
    cpus: 0
    data_volume: 0
    hide_links: false
    id: n2
    image_definition: null
    label: SW-MGMT
    node_definition: unmanaged_switch
    ram: 0
    tags: []
    x: 0
    y: 160
    interfaces:
    - id: i0
      label: port0
      slot: 0
      type: physical
    - id: i1
      label: port1
      slot: 1
      type: physical
    - id: i2
      label: port2
      slot: 2
      type: physical
    - id: i3
      label: port3
      slot: 3
      type: physical
    - id: i4
      label: port4
      slot: 4
      type: physical
    - id: i5
      label: port5
      slot: 5
      type: physical
    - id: i6
      label: port6
      slot: 6
      type: physical
    - id: i7
      label: port7
      slot: 7
      type: physical
  - boot_disk_size: 16
    configuration: |-
      # this is a shell script which will be sourced at boot
      hostname MGMT-PC
      USERNAME=cisco
      PASSWORD=cisco
      ip addr add 172.16.0.10/24 dev eth0
      ip link set dev eth0 up
      # Optional tools when the node has package/network access:
      #   apk add --no-cache curl python3 py3-pip openssh-client
      #   pip3 install ncclient requests
      # Client examples live in labs/yang-netconf/scripts/ on the GitHub repo.
    cpu_limit: 100
    cpus: 1
    data_volume: 0
    hide_links: false
    id: n3
    image_definition: null
    label: MGMT-PC
    node_definition: alpine
    ram: 512
    tags: []
    x: 0
    y: 320
    interfaces:
    - id: i0
      label: eth0
      slot: 0
      type: physical
